<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, "fetch");
          if (desc && desc.get && !desc.set && desc.configurable) {
            Object.defineProperty(window, "fetch", {
              get: desc.get,
              set: function () {},
              configurable: true,
              enumerable: desc.enumerable,
            });
          }
        } catch (_) {}

        window.addEventListener(
          "error",
          function (event) {
            var src = (event && (event.filename || (event.error && event.error.stack))) || "";
            var msg = (event && (event.message || (event.error && event.error.message))) || "";
            if (
              typeof src === "string" &&
              (src.indexOf("chrome-extension://") !== -1 || src.indexOf("moz-extension://") !== -1) &&
              typeof msg === "string" &&
              msg.indexOf("Cannot set property fetch") !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
